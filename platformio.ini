; iaes-opta-runtime — PlatformIO build configuration
;
; This file is for building the examples, not the library itself.
; The library is consumed via library.json.

[env]
platform = ststm32
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/ArduinoModbus@^1.0.9
    arduino-libraries/ArduinoRS485@^1.0.5
    bblanchon/ArduinoJson@^7.0.0
    arduino-libraries/ArduinoMqttClient@^0.1.8
    arduino-libraries/Ethernet@^2.0.2

[env:opta]
board = opta
build_src_filter = +<../examples/single_vfd/>

[env:opta_multi]
board = opta
build_src_filter = +<../examples/multi_device/>

[env:opta_energy]
board = opta
build_src_filter = +<../examples/energy_meter/>
