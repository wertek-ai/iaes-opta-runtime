; iaes-opta-runtime — PlatformIO configuration
;
; The library itself is consumed via library.json. This file exists for the
; conformance test.
;
; The examples are NOT built from here. Their environments used
; `build_src_filter = +<../examples/.../>`, which points outside src/ and which
; PlatformIO refuses: `pio run -e opta` failed with "Nothing to build". They
; are built in CI with `pio ci`, which is the documented way to compile the
; examples of an Arduino library and needs no filter at all.

[env:native]
; Conformance runs on a host: whether this runtime's content_hash agrees with
; the Python and TypeScript SDKs is not a question a board can answer. No
; framework here on purpose -- inheriting `framework = arduino` made PlatformIO
; ask for a board.
platform = native
test_framework = unity
; Without this the test links against nothing: pio test excludes src/ by default.
test_build_src = true
test_filter = test_conformance
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_src_filter = +<iaes/IaesCanonical.cpp> +<iaes/IaesHash.cpp>
build_flags = -std=c++17 -I src

; The whole runtime, on a laptop, against a software Modbus slave and a broker
; the harness terminates itself. This is what makes the library trialable
; without an Opta -- and tools/e2e.py is the gate that authorizes publishing.
[env:host]
platform = native
test_framework = unity
test_filter = test_e2e
test_build_src = true
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_flags = -std=c++17 -I src -I test/host
extra_scripts = pre:tools/host_platform.py
